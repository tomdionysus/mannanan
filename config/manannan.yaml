manannan:
  cadence: 5m
  source: amazon_check_ip
  registry: aws_route53
  plugin_directories:
    - /usr/lib/manannan/plugins
    - /usr/local/lib/manannan/plugins

source:
  amazon_check_ip:
    endpoint: https://checkip.amazonaws.com/
    timeout_seconds: 10

registry:
  aws_route53:
    hosted_zone_id: Z1234567890EXAMPLE
    record_name: home.example.com
    ttl: 60
    timeout_seconds: 10
    credentials:
      access_key_id: ${AWS_ACCESS_KEY_ID}
      secret_access_key: ${AWS_SECRET_ACCESS_KEY}
      session_token: ${AWS_SESSION_TOKEN}

